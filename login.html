<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Sign in to FloodTwin — Urban Flood Intelligence & Drainage Digital Twin Platform. Access real-time municipal decision support, flood risk modeling, and emergency safe routing.">

    <title>Sign In | FloodTwin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* =====================================================
           RESET & BASE
        ===================================================== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0b1329;
            color: #f8fafc;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* =====================================================
           ANIMATED BACKGROUND
        ===================================================== */
        .login-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        /* Deep animated gradient */
        .login-bg::before {
            content: '';
            position: absolute;
            inset: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(ellipse 600px 500px at 20% 30%, rgba(6, 182, 212, 0.12) 0%, transparent 70%),
                radial-gradient(ellipse 500px 600px at 80% 70%, rgba(37, 99, 235, 0.10) 0%, transparent 70%),
                radial-gradient(ellipse 400px 400px at 50% 50%, rgba(16, 185, 129, 0.06) 0%, transparent 60%);
            animation: bgShift 20s ease-in-out infinite alternate;
        }

        @keyframes bgShift {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-5%, 3%) scale(1.05); }
            100% { transform: translate(3%, -2%) scale(1); }
        }

        /* Grid overlay */
        .login-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(37, 99, 235, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(37, 99, 235, 0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.5;
        }


        /* =====================================================
           RAIN EFFECT
        ===================================================== */
        .rain-container {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .raindrop {
            position: absolute;
            top: -20px;
            width: 1.5px;
            background: linear-gradient(to bottom, transparent, rgba(6, 182, 212, 0.35));
            border-radius: 0 0 2px 2px;
            animation: fall linear infinite;
            opacity: 0;
        }

        @keyframes fall {
            0% {
                transform: translateY(-20px);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 0.6; }
            100% {
                transform: translateY(110vh);
                opacity: 0;
            }
        }


        /* =====================================================
           FLOATING ORB ACCENTS
        ===================================================== */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            pointer-events: none;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: rgba(37, 99, 235, 0.15);
            top: -80px;
            right: -60px;
            animation: float1 12s ease-in-out infinite;
        }

        .orb-2 {
            width: 250px;
            height: 250px;
            background: rgba(6, 182, 212, 0.12);
            bottom: -60px;
            left: -40px;
            animation: float2 15s ease-in-out infinite;
        }

        .orb-3 {
            width: 180px;
            height: 180px;
            background: rgba(16, 185, 129, 0.08);
            top: 50%;
            left: 50%;
            animation: float3 18s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-30px, 40px); }
        }
        @keyframes float2 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(40px, -30px); }
        }
        @keyframes float3 {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-40%, -60%) scale(1.15); }
        }


        /* =====================================================
           LOGIN CARD
        ===================================================== */
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 0 20px;
            animation: cardEntry 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes cardEntry {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-card {
            background: rgba(17, 28, 56, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 48px 40px 40px;
            box-shadow:
                0 24px 80px rgba(0, 0, 0, 0.45),
                0 0 0 1px rgba(255, 255, 255, 0.03) inset,
                0 1px 0 rgba(255, 255, 255, 0.06) inset;
            transition: border-color 0.3s ease;
        }

        .login-card:hover {
            border-color: rgba(37, 99, 235, 0.2);
        }


        /* =====================================================
           BRAND HEADER
        ===================================================== */
        .login-brand {
            text-align: center;
            margin-bottom: 36px;
        }

        .login-brand .logo {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
        }

        .login-brand .logo span:first-child {
            color: #94a3b8;
        }

        .login-brand .logo b {
            color: #f8fafc;
        }

        .login-brand .logo small {
            font-size: 8px;
            font-weight: 600;
            color: #06b6d4;
            letter-spacing: 2px;
            margin-left: 6px;
            padding: 2px 5px;
            border: 1px solid rgba(6, 182, 212, 0.3);
            border-radius: 4px;
            vertical-align: super;
        }

        .login-brand .logo-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            margin: 0 auto 14px;
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.2), rgba(6, 182, 212, 0.2));
            border: 1px solid rgba(37, 99, 235, 0.25);
            border-radius: 14px;
            font-size: 24px;
            animation: iconPulse 3s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.2); }
            50% { box-shadow: 0 0 0 10px rgba(37, 99, 235, 0); }
        }

        .login-brand h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .login-brand p {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.5;
        }


        /* =====================================================
           FORM ELEMENTS
        ===================================================== */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            color: #64748b;
            pointer-events: none;
            transition: color 0.2s ease;
        }

        .input-wrapper input {
            width: 100%;
            height: 48px;
            padding: 0 14px 0 44px;
            background: rgba(15, 25, 51, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: #f8fafc;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            outline: none;
            transition: all 0.25s ease;
        }

        .input-wrapper input::placeholder {
            color: #475569;
            font-weight: 400;
        }

        .input-wrapper input:focus {
            border-color: rgba(37, 99, 235, 0.5);
            background: rgba(15, 25, 51, 1);
            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.12),
                0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .input-wrapper input:focus ~ .input-icon {
            color: #2563eb;
        }

        /* Password visibility toggle */
        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #64748b;
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: #94a3b8;
        }


        /* =====================================================
           FORM ROW (REMEMBER + FORGOT)
        ===================================================== */
        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox-group input[type="checkbox"] {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            background: rgba(15, 25, 51, 0.8);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .checkbox-group input[type="checkbox"]:checked {
            background: #2563eb;
            border-color: #2563eb;
        }

        .checkbox-group input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 10px;
            font-weight: 700;
        }

        .checkbox-group span {
            font-size: 13px;
            color: #94a3b8;
            user-select: none;
        }

        .forgot-link {
            font-size: 13px;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: #60a5fa;
        }


        /* =====================================================
           SUBMIT BUTTON
        ===================================================== */
        .btn-login {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #2563eb, #06b6d4);
            color: #fff;
            letter-spacing: 0.3px;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #1d4ed8, #0891b2);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow:
                0 12px 35px rgba(37, 99, 235, 0.35),
                0 4px 12px rgba(6, 182, 212, 0.2);
        }

        .btn-login:hover::before {
            opacity: 1;
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login span {
            position: relative;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-login .btn-arrow {
            transition: transform 0.3s ease;
        }

        .btn-login:hover .btn-arrow {
            transform: translateX(4px);
        }


        /* =====================================================
           DIVIDER
        ===================================================== */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 28px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.07);
        }

        .divider span {
            font-size: 12px;
            font-weight: 500;
            color: #64748b;
            letter-spacing: 1px;
            text-transform: uppercase;
        }


        /* =====================================================
           SOCIAL LOGIN
        ===================================================== */
        .social-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-social {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            height: 46px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            background: rgba(15, 25, 51, 0.6);
            color: #cbd5e1;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-social:hover {
            background: rgba(15, 25, 51, 0.9);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .btn-social svg {
            width: 18px;
            height: 18px;
        }


        /* =====================================================
           FOOTER LINK
        ===================================================== */
        .login-footer {
            text-align: center;
            margin-top: 28px;
            font-size: 14px;
            color: #64748b;
        }

        .login-footer a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .login-footer a:hover {
            color: #60a5fa;
        }


        /* =====================================================
           STATUS BADGE
        ===================================================== */
        .system-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 16px;
            font-size: 11px;
            color: #64748b;
            letter-spacing: 0.5px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            animation: statusPulse 2s ease-in-out infinite;
        }

        @keyframes statusPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            50% { box-shadow: 0 0 0 5px rgba(16, 185, 129, 0); }
        }


        /* =====================================================
           ERROR / VALIDATION STATES
        ===================================================== */
        .input-wrapper input.error {
            border-color: rgba(239, 68, 68, 0.5);
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }

        .error-text {
            font-size: 12px;
            color: #ef4444;
            margin-top: 6px;
            display: none;
            align-items: center;
            gap: 4px;
        }

        .error-text.visible {
            display: flex;
        }


        /* =====================================================
           LOADING STATE
        ===================================================== */
        .btn-login.loading span {
            opacity: 0;
        }

        .btn-login.loading::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            z-index: 2;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */
        @media (max-width: 480px) {
            .login-card {
                padding: 36px 24px 30px;
                border-radius: 16px;
            }

            .login-brand .logo-icon {
                width: 44px;
                height: 44px;
                font-size: 20px;
            }

            .login-brand h1 {
                font-size: 20px;
            }

            .social-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- =====================================================
         ANIMATED BACKGROUND
    ===================================================== -->
    <div class="login-bg"></div>
    <div class="rain-container" id="rainContainer"></div>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>


    <!-- =====================================================
         LOGIN CARD
    ===================================================== -->
    <div class="login-wrapper">
        <div class="login-card">

            <!-- Brand -->
            <div class="login-brand">
                <div class="logo-icon">🌊</div>
                <div class="logo">
                    <span>FLOOD</span><b>TWIN</b>
                    <small>EOC</small>
                </div>
                <h1>Welcome Back</h1>
                <p>Sign in to access the Emergency Operations Center</p>
            </div>


            <!-- Login Form -->
            <form id="loginForm" novalidate>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email"
                               placeholder="you@municipality.gov.in"
                               autocomplete="email" required>
                        <span class="input-icon">✉</span>
                    </div>
                    <div class="error-text" id="emailError">
                        ⚠ Please enter a valid email address
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password"
                               placeholder="Enter your password"
                               autocomplete="current-password" required>
                        <span class="input-icon">🔒</span>
                        <button type="button" class="toggle-password" id="togglePassword"
                                aria-label="Toggle password visibility">
                            👁
                        </button>
                    </div>
                    <div class="error-text" id="passwordError">
                        ⚠ Password must be at least 8 characters
                    </div>
                </div>

                <!-- Remember / Forgot -->
                <div class="form-row">
                    <label class="checkbox-group">
                        <input type="checkbox" id="remember" name="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn-login" id="btnLogin">
                    <span>
                        Sign In to Dashboard
                        <span class="btn-arrow">→</span>
                    </span>
                </button>
            </form>


            <!-- Divider -->
            <div class="divider">
                <span>or continue with</span>
            </div>

            <!-- Social Login -->
            <div class="social-buttons">
                <button class="btn-social" id="btnGoogle" type="button">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1Z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23Z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.96 10.96 0 0 0 1 12c0 1.77.43 3.45 1.18 4.93l3.66-2.84Z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53Z" fill="#EA4335"/>
                    </svg>
                    Google
                </button>

                <button class="btn-social" id="btnMicrosoft" type="button">
                    <svg viewBox="0 0 24 24" fill="none">
                        <rect x="1" y="1" width="10" height="10" fill="#F25022"/>
                        <rect x="13" y="1" width="10" height="10" fill="#7FBA00"/>
                        <rect x="1" y="13" width="10" height="10" fill="#00A4EF"/>
                        <rect x="13" y="13" width="10" height="10" fill="#FFB900"/>
                    </svg>
                    Microsoft
                </button>
            </div>


            <!-- Sign Up Link -->
            <div class="login-footer">
                Don't have an account? <a href="signup.html">Sign Up</a>
            </div>

            <!-- System Status -->
            <div class="system-status">
                <span class="status-dot"></span>
                All systems operational
            </div>

        </div>
    </div>


    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->
    <script>
        /* ----- Rain Effect ----- */
        (function createRain() {
            const container = document.getElementById('rainContainer');
            const COUNT = 80;
            for (let i = 0; i < COUNT; i++) {
                const drop = document.createElement('div');
                drop.classList.add('raindrop');
                drop.style.left = Math.random() * 100 + '%';
                drop.style.height = Math.random() * 18 + 12 + 'px';
                drop.style.animationDuration = Math.random() * 1.2 + 0.8 + 's';
                drop.style.animationDelay = Math.random() * 3 + 's';
                drop.style.opacity = Math.random() * 0.3 + 0.1;
                container.appendChild(drop);
            }
        })();


        /* ----- Toggle Password Visibility ----- */
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        toggleBtn.addEventListener('click', () => {
            const isHidden = passwordInput.type === 'password';
            passwordInput.type = isHidden ? 'text' : 'password';
            toggleBtn.textContent = isHidden ? '🙈' : '👁';
        });


        /* ----- Form Validation & Submit ----- */
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const btnLogin = document.getElementById('btnLogin');

        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        /* Remove error on typing */
        emailInput.addEventListener('input', () => {
            emailInput.classList.remove('error');
            emailError.classList.remove('visible');
        });
        passwordInput.addEventListener('input', () => {
            passwordInput.classList.remove('error');
            passwordError.classList.remove('visible');
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            let valid = true;

            if (!validateEmail(emailInput.value.trim())) {
                emailInput.classList.add('error');
                emailError.classList.add('visible');
                valid = false;
            }

            if (passwordInput.value.length < 8) {
                passwordInput.classList.add('error');
                passwordError.classList.add('visible');
                valid = false;
            }

            if (!valid) return;

            /* Simulate login */
            btnLogin.classList.add('loading');
            btnLogin.disabled = true;

            setTimeout(() => {
                btnLogin.classList.remove('loading');
                btnLogin.disabled = false;
                /* Redirect to main dashboard */
                window.location.href = 'index.html';
            }, 2000);
        });


        /* ----- Social buttons (placeholder) ----- */
        document.getElementById('btnGoogle').addEventListener('click', () => {
            alert('Google SSO integration coming soon.');
        });
        document.getElementById('btnMicrosoft').addEventListener('click', () => {
            alert('Microsoft SSO integration coming soon.');
        });
    </script>

</body>
</html>
